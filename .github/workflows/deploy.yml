name: Deploy Multi-Version Wanderlust to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebGPU
        working-directory: ./WEBGPU
        run: |
          npm ci || npm install
          npm run build

      - name: Build WebGL
        working-directory: ./WEBGL
        run: |
          npm ci || npm install
          npm run build

      - name: Build Flight Merged
        working-directory: ./FLIGHT_MERGED
        run: |
          npm ci || npm install
          npm run build

      - name: Build Legacy
        working-directory: ./LEGACY
        run: |
          npm ci || npm install
          npm run build

      - name: Assemble Combined Site Distribution
        run: |
          mkdir -p dist/webgl dist/flight_merged dist/legacy
          cp -r WEBGPU/dist/* dist/
          cp -r WEBGL/dist/* dist/webgl/
          cp -r FLIGHT_MERGED/dist/* dist/flight_merged/
          cp -r LEGACY/dist/* dist/legacy/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
