<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Model Viewer - Transparent</title>
  
  <style>
    * { box-sizing: border-box; }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      
      /* Visual checkerboard to prove transparency */
      background-color: #f0f0f0;
      background-image: 
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0),
        linear-gradient(45deg, #e0e0e0 25%, transparent 25%, transparent 75%, #e0e0e0 75%, #e0e0e0);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      outline: none;
    }

    /* Terminal-style geometric UI container */
    .ui-container {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 10;
    }

    .btn {
      background: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 10px 16px;
      font-family: monospace;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .btn:hover {
      background: #000000;
      color: #ffffff;
    }

    .btn-active {
      background: #000000;
      color: #ffffff;
    }

    input[type="file"] {
      display: none;
    }

    #labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    
    .label {
      position: absolute;
      background: rgba(255, 255, 255, 0.95);
      color: #000;
      border: 1px solid #000;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 13px;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }

    .label-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .label-header .name {
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .label-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .anim-select {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      font-family: monospace;
      font-size: 12px;
      padding: 4px 6px;
      cursor: pointer;
      outline: none;
      flex: 1;
      max-width: 180px;
    }

    .anim-select:hover {
      background: #eee;
    }

    .anim-btn {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      padding: 4px 8px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    .anim-btn:hover {
      background: #000;
      color: #fff;
    }
  </style>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="labels-container"></div>
  
  <div class="ui-container">
    <label class="btn" for="file-upload">
      [ Load GLB(s) ]
    </label>
    <input type="file" id="file-upload" accept=".glb,.gltf" multiple>
    
    <button class="btn" id="master-anim-btn">
      [ Pause ]
    </button>

    <button class="btn" id="speed-btn">
      [ 1.0x ]
    </button>
    
    <button class="btn" id="export-btn">
      [ Export PNG ]
    </button>
    
    <button class="btn" id="fs-btn">
      [ Fullscreen ]
    </button>

    <button class="btn" id="clear-btn">
      [ Clear ]
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // Scene setup
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    // preserveDrawingBuffer is true to allow PNG export
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 0.1;
    controls.maxDistance = 500;

    // Lighting (Environment)
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7.5);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // Loaders setup with Draco decoder
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
    
    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // State variables
    let models = [];
    let modelIndex = 0;
    const spacing = 5; // Spacing between models

    const SPEEDS = [0.25, 0.5, 1.0, 1.5, 2.0];
    let currentSpeedIndex = 2; // 1.0x
    let globalPlaybackSpeed = 1.0;
    let isMasterPlaying = true;

    const clock = new THREE.Clock();

    const fileUpload = document.getElementById('file-upload');
    const clearBtn = document.getElementById('clear-btn');
    const exportBtn = document.getElementById('export-btn');
    const fsBtn = document.getElementById('fs-btn');
    const masterAnimBtn = document.getElementById('master-anim-btn');
    const speedBtn = document.getElementById('speed-btn');
    const labelsContainer = document.getElementById('labels-container');

    // Drag & Drop handlers
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadFiles(e.dataTransfer.files);
      }
    });

    fileUpload.addEventListener('change', (event) => {
      if (event.target.files && event.target.files.length > 0) {
        loadFiles(event.target.files);
      }
      event.target.value = '';
    });

    function loadFiles(files) {
      if (!files.length) return;

      Array.from(files).forEach((file) => {
        if (!file.name.toLowerCase().endsWith('.glb') && !file.name.toLowerCase().endsWith('.gltf')) {
          return;
        }

        const url = URL.createObjectURL(file);
        
        gltfLoader.load(
          url, 
          (gltf) => {
            const model = gltf.scene;

            model.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
                if (child.material) {
                  child.material.side = THREE.DoubleSide;
                }
              }
            });

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = maxDim > 0 ? (4 / maxDim) : 1;

            const wrapper = new THREE.Group();
            model.position.set(-center.x, -center.y, -center.z);
            wrapper.add(model);
            wrapper.scale.setScalar(scale);
            
            const posX = modelIndex * spacing;
            wrapper.position.x = posX;
            scene.add(wrapper);

            // Animation setup
            let mixer = null;
            let actions = [];
            let currentAction = null;
            let isModelPlaying = isMasterPlaying;

            const clips = gltf.animations || [];
            if (clips.length > 0) {
              mixer = new THREE.AnimationMixer(model);
              clips.forEach((clip, i) => {
                const action = mixer.clipAction(clip);
                actions.push({
                  index: i,
                  name: clip.name || `Anim_${i + 1}`,
                  duration: clip.duration,
                  action: action
                });
              });

              currentAction = actions[0].action;
              currentAction.play();
              if (!isModelPlaying) {
                currentAction.paused = true;
              }
            }

            // Create HTML Label
            const labelEl = document.createElement('div');
            labelEl.className = 'label';
            
            const headerEl = document.createElement('div');
            headerEl.className = 'label-header';
            
            const nameEl = document.createElement('span');
            nameEl.className = 'name';
            nameEl.textContent = file.name;
            headerEl.appendChild(nameEl);
            labelEl.appendChild(headerEl);

            let selectEl = null;
            let toggleBtn = null;

            if (clips.length > 0) {
              const controlsEl = document.createElement('div');
              controlsEl.className = 'label-controls';

              toggleBtn = document.createElement('button');
              toggleBtn.className = 'anim-btn';
              toggleBtn.textContent = isModelPlaying ? '⏸' : '▶';
              
              toggleBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
              toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                modelData.isPlaying = !modelData.isPlaying;
                toggleBtn.textContent = modelData.isPlaying ? '⏸' : '▶';
                if (modelData.currentAction) {
                  modelData.currentAction.paused = !modelData.isPlaying;
                }
              });
              controlsEl.appendChild(toggleBtn);

              selectEl = document.createElement('select');
              selectEl.className = 'anim-select';
              
              actions.forEach((act, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = `${act.name} (${act.duration.toFixed(1)}s)`;
                selectEl.appendChild(opt);
              });

              selectEl.addEventListener('pointerdown', (e) => e.stopPropagation());
              selectEl.addEventListener('change', (e) => {
                e.stopPropagation();
                const newIdx = parseInt(e.target.value, 10);
                switchAnimation(modelData, newIdx);
              });
              controlsEl.appendChild(selectEl);

              labelEl.appendChild(controlsEl);
            }

            labelsContainer.appendChild(labelEl);

            const modelData = {
              wrapper,
              model,
              file,
              mixer,
              clips,
              actions,
              currentAction,
              currentClipIndex: 0,
              isPlaying: isModelPlaying,
              labelEl,
              toggleBtn,
              selectEl,
              position: new THREE.Vector3(posX, (size.y / 2) * scale + 0.3, 0)
            };

            models.push(modelData);

            const totalWidth = modelIndex * spacing;
            controls.target.set(totalWidth / 2, 0, 0);
            camera.position.x = totalWidth / 2;
            camera.position.z = Math.max(8, (totalWidth + spacing) * 0.85);

            modelIndex++;
            URL.revokeObjectURL(url);
          },
          undefined,
          (error) => {
            console.error('Error loading ' + file.name, error);
            alert('Error loading ' + file.name);
          }
        );
      });
    }

    function switchAnimation(modelData, nextIndex) {
      if (!modelData.mixer || !modelData.actions[nextIndex]) return;
      
      const prevAction = modelData.currentAction;
      const nextAction = modelData.actions[nextIndex].action;

      if (prevAction && prevAction !== nextAction) {
        prevAction.fadeOut(0.2);
      }

      nextAction.reset().fadeIn(0.2).play();
      nextAction.paused = !modelData.isPlaying;

      modelData.currentAction = nextAction;
      modelData.currentClipIndex = nextIndex;

      if (modelData.selectEl) {
        modelData.selectEl.value = nextIndex;
      }
    }

    // Master Animation Toggle
    masterAnimBtn.addEventListener('click', () => {
      isMasterPlaying = !isMasterPlaying;
      masterAnimBtn.textContent = isMasterPlaying ? '[ Pause ]' : '[ Play ]';

      models.forEach((m) => {
        if (m.mixer && m.currentAction) {
          m.isPlaying = isMasterPlaying;
          m.currentAction.paused = !isMasterPlaying;
          if (m.toggleBtn) {
            m.toggleBtn.textContent = isMasterPlaying ? '⏸' : '▶';
          }
        }
      });
    });

    // Speed Toggle
    speedBtn.addEventListener('click', () => {
      currentSpeedIndex = (currentSpeedIndex + 1) % SPEEDS.length;
      globalPlaybackSpeed = SPEEDS[currentSpeedIndex];
      speedBtn.textContent = `[ ${globalPlaybackSpeed.toFixed(globalPlaybackSpeed % 1 === 0 ? 1 : 2)}x ]`;
    });

    // Clear
    clearBtn.addEventListener('click', () => {
      models.forEach((m) => {
        if (m.mixer) m.mixer.stopAllAction();
        scene.remove(m.wrapper);
        if (m.labelEl) m.labelEl.remove();
      });
      models = [];
      modelIndex = 0;
      
      controls.target.set(0, 0, 0);
      camera.position.set(0, 2, 8);
    });

    // Export PNG
    exportBtn.addEventListener('click', () => {
      renderer.render(scene, camera);
      const url = renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'multiviewer-export.png';
      a.click();
    });

    // Fullscreen
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.body.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      fsBtn.textContent = document.fullscreenElement ? '[ Exit ]' : '[ Fullscreen ]';
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta() * globalPlaybackSpeed;
      controls.update();

      models.forEach((m) => {
        if (m.mixer && m.isPlaying) {
          m.mixer.update(delta);
        }
      });

      models.forEach((m) => {
        if (!m.labelEl) return;
        
        const tempV = m.position.clone();
        tempV.project(camera);

        if (tempV.z > 1) {
          m.labelEl.style.display = 'none';
        } else {
          m.labelEl.style.display = 'flex';
          const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
          const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
          m.labelEl.style.left = `${x}px`;
          m.labelEl.style.top = `${y}px`;
        }
      });

      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
